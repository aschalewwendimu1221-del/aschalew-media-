<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}
img{
width:90%;
max-width:400px;
border-radius:10px;
margin-top:20px;
}
video{
width:90%;
max-width:400px;
margin-top:20px;
}
a{
color:gold;
text-decoration:none;
font-size:20px;
}
img:hover {
  transform: scale(1.05);
  transition: 0.3s;
}
</style>

</head>

<body>
<h2>🎬 My Movies</h2>

<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;">
  <div style="background:#222;
padding:20px;
margin:20px;
border-radius:15px;
box-shadow:0 0 15px gray;">
  <div>
    <img src="4141.jpg" width="220"><br>
    <h3>Movie 1</h3>
    
    <video controls width="220" poster="4141.jpg">
      <source src="1313.mp4" type="video/mp4">
    </video>
    </div>
  </div>
  
  <div>
    <img src="2222.jpg" width="220"><br>
    <h3>Movie 2</h3>
    
    <video controls width="220" poster="2222.jpg">
      <source src="2121.mp4" type="video/mp4">
    </video>
  </div>
  
</div>
<h1>🎬 Videos</h1>

<img src="4141.jpg" width="250">

<img src="4141.jpg">
<video controls poster=".jpg">
  <source src="1313.mp4" type="video/mp4">
</video>

<img src="2222.jpg">
<video controls poster="2222.jpg">
  <source src="2121.mp4" type="video/mp4">
</video>
</video>
</video>
