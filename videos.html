<!DOCTYPE html>
<html>

<head>

<title>Aschalew Media Videos</title>

<style>

body{
font-family:Arial;
text-align:center;
background:darkgreen;
color:white;
padding:20px;
}

h1{
color:gold;
}

.video-box{

background:#222;
margin:20px auto;
padding:15px;
border-radius:10px;
max-width:800px;

}

iframe{

width:100%;
height:400px;
border-radius:10px;

}

button{

padding:10px;
margin:5px;
background:gold;
border:none;
cursor:pointer;

}

input{

padding:10px;
width:70%;

}

.comment{

background:#333;
padding:8px;
margin:5px;
border-radius:5px;

}


</style>

</head>


<body>


<h1>Aschalew Media Videos</h1>


<div id="videos"></div>


<a href="index.html">⬅ Back Home</a>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

getDocs,

doc,

updateDoc,

increment,

addDoc,

query,

orderBy

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig={


apiKey:"AIzaSyA3cH-kQPFiUHro5ExuNkCl0RoHCikeWPU",

authDomain:"aschalew-media.firebaseapp.com",

projectId:"aschalew-media",

storageBucket:"aschalew-media.firebasestorage.app",

messagingSenderId:"742494243511",

appId:"1:742494243511:web:d4261e5b1e38909f3edb32"


};



const app=initializeApp(firebaseConfig);

const db=getFirestore(app);



const box=document.getElementById("videos");



function getId(link){


if(link.includes("watch?v="))

return link.split("watch?v=")[1].split("&")[0];


if(link.includes("shorts/"))

return link.split("shorts/")[1].split("?")[0];


if(link.includes("youtu.be/"))

return link.split("youtu.be/")[1].split("?")[0];


return "";

}



async function loadVideos(){


let snap=await getDocs(collection(db,"videos"));


snap.forEach(async(video)=>{


let data=video.data();

let id=getId(data.link);


box.innerHTML+=`

<div class="video-box">


<h2>${data.title}</h2>


<iframe

src="https://www.youtube.com/embed/${id}"

allowfullscreen>

</iframe>


<br>


<button onclick="likeVideo('${video.id}')">

👍 Like (${data.likes || 0})

</button>


<button onclick="shareVideo('${data.link}')">

📤 Share

</button>


<br><br>


<input id="comment-${video.id}" placeholder="Write Comment">


<button onclick="addComment('${video.id}')">

💬 Comment

</button>


<div id="comments-${video.id}">

Loading comments...

</div>


</div>

`;

await loadComments(video.id);


});


}
// Like

window.likeVideo = async function(id){

await updateDoc(
doc(db,"videos",id),
{
likes:increment(1)
}
);

location.reload();

}



// Share

window.shareVideo = function(link){

if(navigator.share){

navigator.share({

title:"Aschalew Media",

url:link

});

}else{

alert("Share not supported");

}

}



// Add Comment

window.addComment = async function(id){


let input =
document.getElementById("comment-"+id);


let text=input.value.trim();



if(text==""){

alert("Write Comment");

return;

}



await addDoc(

collection(db,"videos",id,"comments"),

{

text:text,

date:new Date()

}

);



input.value="";


loadComments(id);


}




// Show Comments

async function loadComments(id){


let area=
document.getElementById("comments-"+id);



area.innerHTML="";



let snap=await getDocs(

query(

collection(db,"videos",id,"comments"),

orderBy("date","desc")

)

);



if(snap.empty){

area.innerHTML="<p>No Comments</p>";

return;

}



snap.forEach((comment)=>{


let data=comment.data();


area.innerHTML+=`

<div class="comment">

💬 ${data.text}

</div>

`;


});


}



loadVideos();


</script>


</body>

</html>
