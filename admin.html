<!DOCTYPE html>
<html>

<head>
  <title>Admin Login</title>
  
  <style>
    body {
      font-family: Arial;
      background: #222;
      color: white;
      text-align: center;
    }
    
    .login-box {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      background: #333;
      border-radius: 10px;
    }
    
    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
    }
    
    button {
      padding: 10px 30px;
      background: gold;
      border: none;
      cursor: pointer;
    }
  </style>
  
</head>

<body>
  
  <div class="login-box">
    
    <h2>Aschalew Media Admin</h2>
    
    <input type="text" id="username" placeholder="Username">
    
    <input type="password" id="password" placeholder="Password">
    
    <button onclick="login()">Login</button>
    
    <p id="message"></p>
    
  </div>
  
  
  <script>
    function login() {
      
      let user = document.getElementById("username").value;
      let pass = document.getElementById("password").value;
      
      
      if (user == "aschalew" && pass == "1234") {
        
        window.location = "dashboard.html";
        
      }
      
      else {
        
        document.getElementById("message").innerHTML = "Wrong Login";
        
      }
      
    }
  </script>
  
</body>

</html>
