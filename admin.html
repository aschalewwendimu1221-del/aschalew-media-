<!DOCTYPE html>
<html>

<head>
<title>Admin Login</title>

<style>

body{
  font-family:Arial;
  text-align:center;
  background:#111;
  color:white;
}

h1{
  color:gold;
}

input{
  padding:10px;
  margin:10px;
  width:250px;
}

button{
  padding:10px 25px;
  background:gold;
  border:none;
  cursor:pointer;
}

</style>

</head>


<body>

<h1>Admin Login</h1>


<input id="email" placeholder="Email">

<br>

<input id="password" type="password" placeholder="Password">

<br>

<button id="loginBtn">Login</button>



<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyA3cH-kQPFiUHro5ExuNkCl0RoHCikeWPU",

authDomain: "aschalew-media.firebaseapp.com",

projectId: "aschalew-media",

storageBucket: "aschalew-media.firebasestorage.app",

messagingSenderId: "742494243511",

appId: "1:742494243511:web:d4261e5b1e38909f3edb32"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



document.getElementById("loginBtn").onclick = function(){


let email = document.getElementById("email").value;

let password = document.getElementById("password").value;



signInWithEmailAndPassword(auth,email,password)

.then((userCredential)=>{


alert("Login Successful");


window.location.href="dashboard.html";


})


.catch((error)=>{


alert("Wrong Email or Password");


});


};



</script>


</body>

</html>
